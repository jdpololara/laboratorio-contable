<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio Contable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Software contable de aula: tinta azul de libro, lápiz rojo de punteo, papel cuadriculado */
  --paper:#f1f3f0; --surface:#ffffff; --surface-2:#f6f7f5; --ink:#15233b; --muted:#5a6577; --line:#d8dde3;
  --accent:#1c4f8f; --accent-ink:#ffffff; --accent-soft:#e2ebf7; --tick:#c3302a; --side:#13233d; --side-ink:#dfe7f3; --side-muted:#93a3bb;
  --ok:#1b7447; --ok-soft:#e0f2e8; --warn:#9a5c00; --warn-soft:#fbefd9; --bad:#b0261e; --bad-soft:#fbe4e1; --hl:#fff1b8;
  --grid:rgba(28,79,143,.05);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f141c; --surface:#161d28; --surface-2:#1b2330; --ink:#e6ebf2; --muted:#9aa6b8; --line:#2b3545;
    --accent:#7fb0ef; --accent-ink:#0d1b2e; --accent-soft:#1d2d45; --tick:#ff7a6e; --side:#0b1018; --side-ink:#dfe7f3; --side-muted:#8696ad;
    --ok:#5fcf93; --ok-soft:#173327; --warn:#f0b257; --warn-soft:#352812; --bad:#ff8a80; --bad-soft:#3a1d1b; --hl:#4a3f12; --grid:rgba(127,176,239,.04); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f141c; --surface:#161d28; --surface-2:#1b2330; --ink:#e6ebf2; --muted:#9aa6b8; --line:#2b3545;
  --accent:#7fb0ef; --accent-ink:#0d1b2e; --accent-soft:#1d2d45; --tick:#ff7a6e; --side:#0b1018; --side-ink:#dfe7f3; --side-muted:#8696ad;
  --ok:#5fcf93; --ok-soft:#173327; --warn:#f0b257; --warn-soft:#352812; --bad:#ff8a80; --bad-soft:#3a1d1b; --hl:#4a3f12; --grid:rgba(127,176,239,.04); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background-color:var(--paper); background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:24px 24px; color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5}
h1,h2,h3,h4{font-family:var(--display); line-height:1.15; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3vw,2.2rem)} h2{font-size:1.4rem} h3{font-size:1.08rem}
p{margin:0} a{color:var(--accent)}
button,select,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:4px}
.num,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* Estructura */
.layout{display:grid; grid-template-columns:250px minmax(0,1fr); min-height:100%}
aside.side{background:var(--side); color:var(--side-ink); padding:16px 12px 30px; position:sticky; top:0; height:100vh; overflow-y:auto}
.brand{display:flex; gap:10px; align-items:center; padding:4px 8px 16px}
.brand-mark{width:36px; height:36px; border-radius:9px; background:#3d7bd0; color:#fff; display:grid; place-items:center; font-family:var(--mono); font-weight:600}
.brand b{font-family:var(--display); font-size:1.05rem; display:block; line-height:1.1}
.brand span{font-size:.75rem; color:var(--side-muted)}
.navg{margin-top:12px}
.navg h4{font-family:var(--mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; color:var(--side-muted); padding:0 10px 4px; font-weight:500}
.navg a{display:block; padding:7px 10px; border-radius:7px; color:var(--side-ink); text-decoration:none; font-size:.9rem}
.navg a:hover{background:rgba(255,255,255,.07)}
.navg a[aria-current="page"]{background:#3d7bd0; color:#fff; font-weight:600}
.topbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 24px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:15}
.topbar .co{margin-right:auto; min-width:0}
.topbar .co b{font-family:var(--display); font-size:1.08rem; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .co span{font-size:.8rem; color:var(--muted)}
.content{padding:24px; max-width:1280px}
.btn.menu-btn{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside.side{position:fixed; inset:0 auto 0 0; width:260px; z-index:40; transform:translateX(-105%); transition:transform .2s}
  aside.side.open{transform:none; box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .btn.menu-btn{display:inline-flex}
  .content{padding:16px}
  .topbar{padding:10px 16px}
}
.stack{display:flex; flex-direction:column; gap:18px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px}
.card.tight{padding:14px 16px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.spread{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
@media (max-width:1000px){ .grid2,.grid3{grid-template-columns:1fr} }
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.eyebrow{font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.lead{color:var(--muted); max-width:72ch}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:8px 15px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); font-weight:600; cursor:pointer; text-decoration:none; line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.quiet{background:var(--surface-2); color:var(--ink); border-color:var(--line)}
.btn.danger{background:var(--bad); border-color:var(--bad); color:#fff}
.btn.sm{padding:5px 10px; font-size:.84rem}
.btn.lg{padding:12px 20px; font-size:1.05rem}
.btn[disabled]{opacity:.45; cursor:not-allowed; filter:none}
.linkbtn{background:none; border:0; padding:0; color:var(--accent); cursor:pointer; text-decoration:underline; font-size:.85rem}
label.f{display:flex; flex-direction:column; gap:4px; font-size:.82rem; font-weight:500; min-width:0}
.in{border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:7px 9px; min-width:0; width:100%}
textarea.in{font-family:var(--mono); font-size:.78rem; min-height:100px}
.in.money{font-family:var(--mono); text-align:right}
.fgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px}
.chk{display:flex; gap:8px; align-items:center; font-size:.88rem}

.chip{display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:999px; font-size:.76rem; font-weight:600; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.chip.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.chip.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.chip.acc{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.dot{width:8px; height:8px; border-radius:50%; background:currentColor}
.note{border-left:4px solid var(--accent); background:var(--accent-soft); padding:10px 14px; border-radius:0 8px 8px 0; font-size:.9rem}
.note.warn{border-color:var(--warn); background:var(--warn-soft)} .note.ok{border-color:var(--ok); background:var(--ok-soft)} .note.bad{border-color:var(--bad); background:var(--bad-soft)}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:12px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px}
.tile span{font-size:.76rem; color:var(--muted)}
.tile b{display:block; font-family:var(--mono); font-size:1.18rem; font-weight:600; line-height:1.3; font-variant-numeric:tabular-nums}

.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
table{border-collapse:collapse; width:100%}
table.t th{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); text-align:left; font-weight:600; padding:8px 10px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap}
table.t td{padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; font-size:.88rem}
table.t tr:last-child td{border-bottom:0}
table.t .n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
table.t tr.tot td{font-weight:700; background:var(--surface-2); border-top:2px solid var(--ink)}
table.t tr.grp td{background:var(--surface-2); font-weight:600}
table.t tr.anul td{color:var(--muted); text-decoration:line-through}
table.t tr.sep td{border-top:2px solid var(--line)}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
table.t tr.hl td{background:var(--hl) !important}
table.t tr.mark-ok td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
table.t tr.mark-bad td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
table.t tr.expl td{background:var(--surface-2); font-size:.84rem; border-left:4px solid var(--accent)}
table.t td.in-cell{padding:4px 6px}
.empty{padding:26px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:var(--r)}
.tick{color:var(--tick); font-weight:700; display:inline-block; transform:rotate(-8deg); margin-left:3px}
select.cls{font-size:.8rem; padding:4px 6px; border-radius:6px; border:1px solid var(--line); background:var(--surface); max-width:200px}
select.cls.filled{border-color:var(--accent); background:var(--accent-soft)}
.res{font-size:.76rem; font-weight:600; white-space:nowrap} .res.ok{color:var(--ok)} .res.bad{color:var(--bad)}

/* POS */
.pos{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr); gap:18px; align-items:start}
@media (max-width:1000px){ .pos{grid-template-columns:1fr} }
.prods{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px}
.prod{display:flex; flex-direction:column; gap:6px; text-align:left; padding:12px; border-radius:9px; border:1px solid var(--line); background:var(--surface); cursor:pointer; min-height:112px}
.prod:hover{border-color:var(--accent)}
.prod b{font-size:.9rem; font-weight:600; line-height:1.25}
.prod .pr{font-family:var(--mono); font-weight:600; color:var(--accent); margin-top:auto}
.prod .st{font-size:.74rem; color:var(--muted)}
.prod[disabled]{opacity:.45; cursor:not-allowed}
.ticket{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; position:sticky; top:76px; display:flex; flex-direction:column; gap:12px}
.tline{display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; font-size:.88rem; padding:6px 0; border-bottom:1px dashed var(--line)}
.qty{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:7px; overflow:hidden}
.qty button{border:0; background:var(--surface-2); width:28px; height:28px; cursor:pointer; font-weight:700}
.qty span{min-width:30px; text-align:center; font-family:var(--mono)}
.totals{display:grid; gap:4px; font-size:.9rem}
.totals div{display:flex; justify-content:space-between; gap:14px}
.totals .big{font-size:1.4rem; font-weight:700; font-family:var(--display)}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.seg button{padding:8px 4px; border-radius:7px; border:1px solid var(--line); background:var(--surface-2); cursor:pointer; font-size:.84rem; font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

/* Arqueo: cajón de caja */
.drawer{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; background:#2b2f36; padding:12px; border-radius:12px}
.comp{background:#1d2026; border-radius:8px; padding:8px; min-height:92px; display:flex; flex-direction:column; gap:6px}
.comp .lab{font-family:var(--mono); font-size:.72rem; color:#aab4c3}
.comp .pile{display:flex; flex-wrap:wrap; gap:3px}
.bill{width:30px; height:15px; border-radius:2px; display:grid; place-items:center; font-size:7px; font-weight:700; color:rgba(0,0,0,.65); box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.bill.fajo{width:34px; height:18px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.3); font-size:8px}
.coin{width:15px; height:15px; border-radius:50%; display:grid; place-items:center; font-size:6px; font-weight:700; color:rgba(0,0,0,.6); box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.empty-comp{color:#6e7787; font-size:.75rem}

/* Documentos */
.modal-bg{position:fixed; inset:0; background:rgba(10,15,25,.55); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto}
.modal{background:var(--surface); border-radius:12px; width:min(860px,100%); padding:22px; box-shadow:0 20px 50px rgba(0,0,0,.3)}
.paper{border:1px solid var(--line); border-radius:8px; padding:22px; background:var(--surface)}
.paper .hdr{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:12px}
.paper .hdr b.n{font-family:var(--display); font-size:1.15rem}
.paper .kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:6px 16px; font-size:.86rem; margin-bottom:12px}
.paper .kv span{color:var(--muted); display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em}
.ticket-paper{width:300px; margin:0 auto; font-family:var(--mono); font-size:.78rem; border:1px dashed var(--line); padding:14px; background:var(--surface)}
.ticket-paper .c{text-align:center} .ticket-paper hr{border:0; border-top:1px dashed var(--line)}
.ticket-paper .r{display:flex; justify-content:space-between; gap:8px}
.paper .grid2 > table{align-self:start}
.qr{width:74px; height:74px; display:grid; grid-template-columns:repeat(9,1fr); gap:1px}
.qr i{background:var(--ink)} .qr i.o{background:transparent}

.stepper{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stepper button{display:flex; flex-direction:column; align-items:flex-start; gap:2px; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 12px; cursor:pointer; text-align:left}
.stepper button span{font-size:.74rem; color:var(--muted)}
.stepper button[aria-current="step"]{border-color:var(--accent); box-shadow:inset 0 -3px 0 var(--accent)}
.recon{display:grid; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
.recon .ln{display:grid; grid-template-columns:40px 1fr 190px 26px; gap:10px; align-items:center; padding:7px 12px; border-top:1px solid var(--line)}
.recon .ln:first-child{border-top:0}
.recon .op{font-family:var(--mono); font-weight:600; color:var(--accent); text-align:center}
.recon .ln.total{background:var(--surface-2); font-weight:600; border-top:2px solid var(--ink)}
.recon .ln.head{background:var(--accent-soft); color:var(--accent); font-weight:600}
.recon .fixed{font-family:var(--mono); text-align:right}
.recon small{display:block; color:var(--muted); font-weight:400; font-size:.75rem}
@media (max-width:560px){ .recon .ln{grid-template-columns:28px 1fr} .recon .ln > :nth-child(n+3){grid-column:2} }
.bars{display:grid; gap:8px}
.bar{display:grid; grid-template-columns:150px 1fr 50px; gap:10px; align-items:center; font-size:.85rem}
.bar .track{height:11px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.bar .fill{height:100%; background:var(--accent)} .bar .fill.ok{background:var(--ok)} .bar .fill.warn{background:var(--warn)} .bar .fill.bad{background:var(--bad)}
.checklist{display:grid; gap:6px; margin:0; padding:0; list-style:none}
.checklist li{display:grid; grid-template-columns:26px 1fr auto; gap:8px; align-items:center; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:.9rem}
.checklist li .ck{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:.75rem; font-weight:700}
.checklist li.done .ck{background:var(--ok); border-color:var(--ok); color:#fff}
.checklist li.done span.t{color:var(--muted)}
.cp{font-family:var(--mono); font-size:.7rem; word-break:break-all; background:var(--surface-2); border:1px dashed var(--line); border-radius:8px; padding:10px; max-height:120px; overflow:auto}
.flash{position:fixed; right:18px; bottom:18px; z-index:70; max-width:380px}
.review-banner{background:var(--warn-soft); color:var(--warn); padding:8px 24px; font-weight:600; font-size:.88rem; display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion: no-preference){ .fade{animation:fade .2s ease} @keyframes fade{from{opacity:.5; transform:translateY(3px)} to{opacity:1; transform:none}} }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ================= Motor contable del laboratorio ================= */
const nf = new Intl.NumberFormat('es-CO', { maximumFractionDigits: 0 });
const fmt = n => (n < 0 ? '−' : '') + '$ ' + nf.format(Math.abs(Math.round(n || 0)));
const fmtN = n => (n ? nf.format(Math.round(n)) : '');
const pad = n => String(n).padStart(2, '0');
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function hashStr(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function makeRng(seed) { let a = hashStr(seed); return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);

/* Fechas (ISO yyyy-mm-dd, en UTC para evitar corrimientos) */
function addDays(iso, n) { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function lastDayOf(P) { const [y, m] = P.split('-').map(Number); return `${P}-${pad(new Date(Date.UTC(y, m, 0)).getUTCDate())}`; }
function nextPeriod(P) { const [y, m] = P.split('-').map(Number); return m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`; }
const perOf = iso => iso.slice(0, 7);
const perName = P => MESES[+P.slice(5) - 1] + ' de ' + P.slice(0, 4);
const fd = iso => (iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '');
const fdc = iso => (iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '');

/* Plan de cuentas de referencia (PUC, Decreto 2650 de 1993) */
const PUC = {
  '1105': 'Caja', '1110': 'Bancos', '1305': 'Clientes', '1355': 'Anticipo de impuestos y contribuciones',
  '1365': 'Cuentas por cobrar a trabajadores', '1435': 'Mercancías no fabricadas por la empresa', '1524': 'Equipo de oficina',
  '2205': 'Proveedores nacionales', '2335': 'Costos y gastos por pagar', '2365': 'Retención en la fuente',
  '2408': 'Impuesto sobre las ventas por pagar', '3105': 'Capital suscrito y pagado',
  '4135': 'Comercio al por mayor y al por menor', '4175': 'Devoluciones en ventas (DB)', '4210': 'Ingresos financieros', '4295': 'Ingresos diversos',
  '5105': 'Gastos de personal', '5115': 'Impuestos', '5120': 'Arrendamientos', '5135': 'Servicios', '5145': 'Mantenimiento y reparaciones', '5195': 'Diversos',
  '5305': 'Gastos financieros', '5315': 'Gastos extraordinarios', '6135': 'Costo de ventas: comercio al por mayor y al por menor'
};
const PUC_LIST = Object.keys(PUC);
const CLASES = { 1: 'Activo', 2: 'Pasivo', 3: 'Patrimonio', 4: 'Ingresos', 5: 'Gastos', 6: 'Costos de ventas' };
const naturaleza = c => (['1', '5', '6'].includes(c[0]) ? 'D' : 'C');
const GASTO_CTAS = ['5120', '5135', '5145', '5195', '5105', '1524'];
const DENOMS = [100000, 50000, 20000, 10000, 5000, 2000, 1000, 500, 200, 100, 50];
const BILLETES = [100000, 50000, 20000, 10000, 5000, 2000];

const TIPOS = {
  INI: 'Saldos iniciales', FE: 'Factura electrónica de venta', POS: 'Documento equivalente POS', RC: 'Recibo de caja',
  FC: 'Factura de compra', CE: 'Comprobante de egreso', CG: 'Consignación', NC: 'Nota de contabilidad', AQ: 'Arqueo de caja',
  EXT: 'Extracto bancario', CON: 'Conciliación bancaria'
};
const MEDIOS = { efectivo: 'Efectivo', transferencia: 'Transferencia', tarjeta: 'Tarjeta (datáfono)', credito: 'Crédito', cheque: 'Cheque' };

/* ---------- Utilidades de documentos ---------- */
function newId(t) { return t + '-' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
function nextNum(D, tipo) { let m = 0; Object.values(D.tx).forEach(t => { if (t.tipo === tipo && t.num > m) m = t.num; }); return m + 1; }
function nextCheque(D) { let m = D.meta.banco.chequeIni - 1; Object.values(D.tx).forEach(t => (t.asiento || []).forEach(l => { if (l.bank && l.bank.k === 'chq' && l.bank.n > m) m = l.bank.n; })); return m + 1; }
function tercero(D, id) { return (D.meta.terceros || []).find(t => t.id === id) || { id, nombre: 'Tercero', doc: '' }; }
function producto(D, id) { return (D.meta.productos || []).find(p => p.id === id); }
function docLabel(t) { return t.tipo === 'FE' ? `${t.pref || 'FE'}-${t.num}` : t.tipo === 'FC' ? `FC-${t.num}` : t.tipo === 'INI' ? 'Saldos iniciales' : `${t.tipo}-${t.num}`; }
function calcItems(items) { let base = 0, iva = 0; items.forEach(it => { const b = Math.round(it.q * it.vu); base += b; iva += Math.round(b * (it.iva || 0) / 100); }); return { base, iva, total: base + iva }; }
function checkBalance(asiento) {
  const d = sum(asiento, l => l.d || 0), h = sum(asiento, l => l.h || 0);
  if (Math.abs(d - h) > 0.5) throw new Error('El asiento no cuadra: débitos ' + fmt(d) + ' y créditos ' + fmt(h) + '.');
  asiento.forEach(l => { if (!PUC[l.c]) throw new Error('Cuenta no válida: ' + l.c); });
  return asiento.filter(l => (l.d || 0) > 0 || (l.h || 0) > 0);
}

/* ---------- Cálculos derivados ---------- */
function compute(D) {
  if (D._c && D._c.ver === D.ver) return D._c;
  const all = Object.values(D.tx).sort((a, b) => (a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.ts || 0) - (b.ts || 0)));
  const act = all.filter(t => !t.anulado);
  const lines = [];
  act.forEach(t => (t.asiento || []).forEach((l, i) => lines.push({ ...l, key: t.id + ':' + i, tx: t, fecha: t.fecha })));
  const cxc = {}, cxp = {};
  lines.forEach(l => {
    if (l.c === '1305' && l.ap) cxc[l.ap] = (cxc[l.ap] || 0) + (l.d || 0) - (l.h || 0);
    if (l.c === '2205' && l.ap) cxp[l.ap] = (cxp[l.ap] || 0) + (l.h || 0) - (l.d || 0);
  });
  const inv = {};
  (D.meta.productos || []).forEach(p => { inv[p.id] = { stock: p.stock0 || 0, costo: p.costo0 || p.costo || 0 }; });
  act.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)).forEach(t => (t.items || []).forEach(it => {
    const s = inv[it.p]; if (!it.p || !s) return;
    if (t.tipo === 'FC') { const ns = s.stock + it.q; s.costo = ns > 0 ? (s.stock * s.costo + it.q * it.vu) / ns : it.vu; s.stock = ns; }
    else if (t.tipo === 'FE' || t.tipo === 'POS') s.stock -= it.q;
  }));
  const extracts = all.filter(t => t.tipo === 'EXT').sort((a, b) => (a.periodo < b.periodo ? -1 : 1));
  return (D._c = { ver: D.ver, all, act, lines, cxc, cxp, inv, extracts });
}
function saldo(C, c, hasta) { let s = 0; C.lines.forEach(l => { if (l.c === c && (!hasta || l.fecha <= hasta)) s += (l.d || 0) - (l.h || 0); }); return s; }

/* ---------- Constructores de documentos ---------- */
function baseTx(D, tipo, fecha) {
  if (!fecha) throw new Error('Falta la fecha del documento.');
  if (fecha < D.meta.inicio) throw new Error('La fecha no puede ser anterior al inicio de la empresa (' + fd(D.meta.inicio) + ').');
  return { id: newId(tipo), tipo, num: nextNum(D, tipo), fecha, ts: Date.now() };
}
function buildVenta(D, f, tipo) {
  const C = compute(D);
  const items = (f.items || []).filter(it => it.p && it.q > 0);
  if (!items.length) throw new Error('Agrega al menos un producto con cantidad mayor que cero.');
  const need = {}; items.forEach(it => { need[it.p] = (need[it.p] || 0) + it.q; if (!(it.vu > 0)) throw new Error('Revisa el precio de ' + (producto(D, it.p) || {}).nombre + '.'); });
  Object.entries(need).forEach(([p, q]) => { const s = C.inv[p]; if (!s || s.stock < q) throw new Error(`No hay inventario suficiente de ${producto(D, p).nombre}: disponibles ${s ? s.stock : 0}.`); });
  if (!f.tercero) throw new Error('Selecciona el cliente.');
  if (!MEDIOS[f.medio]) throw new Error('Selecciona la forma de pago.');
  const t = baseTx(D, tipo, f.fecha);
  if (tipo === 'FE') { t.pref = D.meta.resol.prefijo; if (t.num > D.meta.resol.hasta) throw new Error('Se agotó el rango de numeración autorizado.'); }
  t.tercero = f.tercero; t.medio = f.medio;
  t.items = items.map(it => { const p = producto(D, it.p); return { p: it.p, nombre: p.nombre, q: it.q, vu: Math.round(it.vu), iva: p.iva }; });
  const { base, iva, total } = calcItems(t.items);
  const ret = tipo === 'FE' && f.ret ? Math.round(base * 0.025) : 0;
  const neto = total - ret;
  const costo = sum(t.items, it => Math.round(it.q * C.inv[it.p].costo));
  Object.assign(t, { base, iva, total, ret, neto, costo });
  if (tipo === 'FE') { t.vence = f.medio === 'credito' ? addDays(t.fecha, 30) : t.fecha; t.cufe = hashStr(t.id + base).toString(16) + hashStr(t.id + 'c').toString(16) + hashStr(t.fecha + total).toString(16); }
  if (tipo === 'POS' && f.medio === 'efectivo') { t.recibido = Math.max(neto, Math.round(f.recibido || neto)); t.cambio = t.recibido - neto; }
  const ter = f.tercero, a = [];
  if (f.medio === 'efectivo') a.push({ c: '1105', d: neto, x: 'Venta de contado en efectivo' });
  else if (f.medio === 'transferencia') a.push({ c: '1110', d: neto, x: 'Venta pagada por transferencia', bank: { k: 'tin' } });
  else if (f.medio === 'tarjeta') a.push({ c: '1110', d: neto, x: 'Venta pagada con tarjeta', bank: { k: 'datafono' } });
  else if (f.medio === 'credito' && tipo === 'FE') a.push({ c: '1305', d: neto, x: 'Venta a crédito a 30 días', t: ter, ap: t.id });
  else throw new Error('Forma de pago no válida para este documento.');
  if (ret) a.push({ c: '1355', d: ret, x: 'Retención en la fuente que nos practicó el cliente (2,5 %)', t: ter });
  a.push({ c: '4135', h: base, x: 'Venta de mercancías' });
  if (iva) a.push({ c: '2408', h: iva, x: 'IVA generado' });
  if (costo) a.push({ c: '6135', d: costo, x: 'Costo de la mercancía vendida' }, { c: '1435', h: costo, x: 'Salida de inventario' });
  t.asiento = checkBalance(a);
  return t;
}
function buildCompra(D, f) {
  const C = compute(D);
  const items = (f.items || []).filter(it => (it.tipo === 'prod' ? it.p : it.cta) && it.q > 0 && it.vu > 0);
  if (!items.length) throw new Error('Agrega al menos un renglón con cantidad y valor.');
  if (!f.tercero) throw new Error('Selecciona el proveedor.');
  if (!String(f.factProv || '').trim()) throw new Error('Escribe el número de la factura del proveedor.');
  if (!MEDIOS[f.medio] || f.medio === 'tarjeta') throw new Error('Selecciona la forma de pago.');
  const t = baseTx(D, 'FC', f.fecha);
  t.tercero = f.tercero; t.medio = f.medio; t.factProv = String(f.factProv).trim(); t.retPct = +f.retPct || 0;
  t.items = items.map(it => it.tipo === 'prod'
    ? { tipo: 'prod', p: it.p, nombre: producto(D, it.p).nombre, q: it.q, vu: Math.round(it.vu), iva: +it.iva || 0 }
    : { tipo: 'gasto', cta: it.cta, nombre: it.desc || PUC[it.cta], q: it.q, vu: Math.round(it.vu), iva: +it.iva || 0 });
  const { base, iva, total } = calcItems(t.items);
  const ret = Math.round(base * t.retPct / 100), neto = total - ret;
  Object.assign(t, { base, iva, total, ret, neto });
  const a = [], byCta = {};
  t.items.forEach(it => { const c = it.tipo === 'prod' ? '1435' : it.cta; byCta[c] = (byCta[c] || 0) + Math.round(it.q * it.vu); });
  Object.entries(byCta).forEach(([c, v]) => a.push({ c, d: v, x: c === '1435' ? 'Compra de mercancías' : PUC[c] }));
  if (iva) a.push({ c: '2408', d: iva, x: 'IVA descontable' });
  if (ret) a.push({ c: '2365', h: ret, x: `Retención en la fuente practicada (${String(t.retPct).replace('.', ',')} %)`, t: f.tercero });
  if (f.medio === 'credito') a.push({ c: '2205', h: neto, x: 'Compra a crédito', t: f.tercero, ap: t.id });
  else if (f.medio === 'efectivo') { if (saldo(C, '1105') < neto) throw new Error('No hay efectivo suficiente en caja (' + fmt(saldo(C, '1105')) + ').'); a.push({ c: '1105', h: neto, x: 'Pago de contado en efectivo' }); }
  else { if (saldo(C, '1110') < neto) throw new Error('El saldo en bancos no alcanza (' + fmt(saldo(C, '1110')) + ').'); const b = f.medio === 'cheque' ? { k: 'chq', n: nextCheque(D) } : { k: 'tout' }; t.cheque = b.n; a.push({ c: '1110', h: neto, x: f.medio === 'cheque' ? `Pago con cheque Nº ${b.n}` : 'Pago por transferencia', bank: b }); }
  t.asiento = checkBalance(a);
  return t;
}
function buildRC(D, f) {
  const C = compute(D), pend = C.cxc[f.ap] || 0, v = Math.round(+f.valor || 0);
  if (!f.ap) throw new Error('Selecciona la factura que se recauda.');
  if (!(v > 0)) throw new Error('Escribe el valor recibido.');
  if (v > pend) throw new Error('El valor supera el saldo de la factura (' + fmt(pend) + ').');
  const fac = D.tx[f.ap];
  const t = baseTx(D, 'RC', f.fecha); t.tercero = fac.tercero; t.ap = f.ap; t.valor = v; t.medio = f.medio;
  const a = [f.medio === 'efectivo' ? { c: '1105', d: v, x: 'Recaudo en efectivo' } : { c: '1110', d: v, x: 'Recaudo por transferencia', bank: { k: 'tin' } },
  { c: '1305', h: v, x: `Abono a factura ${docLabel(fac)}`, t: fac.tercero, ap: f.ap }];
  t.asiento = checkBalance(a); return t;
}
function buildCE(D, f) {
  const C = compute(D), pend = C.cxp[f.ap] || 0, v = Math.round(+f.valor || 0);
  if (!f.ap) throw new Error('Selecciona la factura del proveedor que se paga.');
  if (!(v > 0)) throw new Error('Escribe el valor a pagar.');
  if (v > pend) throw new Error('El valor supera el saldo por pagar (' + fmt(pend) + ').');
  if (saldo(C, '1110') < v) throw new Error('El saldo en bancos no alcanza (' + fmt(saldo(C, '1110')) + ').');
  const fac = D.tx[f.ap];
  const t = baseTx(D, 'CE', f.fecha); t.tercero = fac.tercero; t.ap = f.ap; t.valor = v; t.medio = f.medio;
  const b = f.medio === 'cheque' ? { k: 'chq', n: nextCheque(D) } : { k: 'tout' }; t.cheque = b.n;
  t.asiento = checkBalance([{ c: '2205', d: v, x: `Pago factura ${fac.factProv}`, t: fac.tercero, ap: f.ap },
  { c: '1110', h: v, x: f.medio === 'cheque' ? `Cheque Nº ${b.n}` : 'Transferencia a proveedor', bank: b }]);
  return t;
}
function buildCG(D, f) {
  const C = compute(D), v = Math.round(+f.valor || 0);
  if (!(v > 0)) throw new Error('Escribe el valor a consignar.');
  if (v > saldo(C, '1105')) throw new Error('No puedes consignar más del efectivo en caja (' + fmt(saldo(C, '1105')) + ').');
  const t = baseTx(D, 'CG', f.fecha); t.valor = v; t.ref = String(f.ref || '').trim();
  t.asiento = checkBalance([{ c: '1110', d: v, x: 'Consignación de efectivo' + (t.ref ? ` · volante ${t.ref}` : ''), bank: { k: 'dep' } }, { c: '1105', h: v, x: 'Traslado de caja a bancos' }]);
  return t;
}
function buildNota(D, f) {
  const ls = (f.lines || []).filter(l => l.c && ((+l.d || 0) > 0 || (+l.h || 0) > 0)).map(l => ({ c: l.c, d: Math.round(+l.d || 0), h: Math.round(+l.h || 0), x: (l.x || '').trim() }));
  if (ls.length < 2) throw new Error('Una nota necesita al menos dos renglones.');
  if (ls.some(l => l.d && l.h)) throw new Error('Cada renglón va al débito o al crédito, no a ambos.');
  if (ls.some(l => l.c === '1110')) throw new Error('Los movimientos de Bancos se registran con sus documentos o desde la conciliación bancaria.');
  if (!String(f.concepto || '').trim()) throw new Error('Escribe el concepto de la nota.');
  const t = baseTx(D, 'NC', f.fecha); t.concepto = f.concepto.trim(); t.asiento = checkBalance(ls); return t;
}
function buildInicial(D, f) {
  const C = compute(D);
  const inv = sum(D.meta.productos || [], p => Math.round((p.stock0 || 0) * (p.costo0 || 0)));
  const a = [];
  if (f.caja > 0) a.push({ c: '1105', d: f.caja, x: 'Saldo inicial de caja' });
  if (f.banco > 0) a.push({ c: '1110', d: f.banco, x: 'Saldo inicial en bancos' });
  if (inv > 0) a.push({ c: '1435', d: inv, x: 'Inventario inicial de mercancías' });
  a.push({ c: '3105', h: (f.caja || 0) + (f.banco || 0) + inv, x: 'Aportes de los socios' });
  return { id: 'INI-0', tipo: 'INI', num: 0, fecha: D.meta.inicio, ts: 1, asiento: checkBalance(a) };
}

/* ---------- Arqueo de caja ---------- */
function round50(n) { return Math.round(n / 50) * 50; }
function makeDrawer(total, seed) {
  const r = makeRng(seed), counts = {}; let R = total;
  for (const d of DENOMS) {
    const max = Math.floor(R / d); let q;
    if (d >= 20000) q = Math.floor(max * (0.45 + r() * 0.4));
    else if (d >= 1000) q = Math.max(0, max - Math.floor(r() * (d === 1000 ? 7 : 4)));
    else q = max;
    counts[d] = q; R -= q * d;
  }
  return counts;
}
function arqueoSetup(D, fecha, cfg) {
  const C = compute(D);
  const libros = saldo(C, '1105', fecha);
  const prev = C.act.filter(t => t.tipo === 'AQ');
  const carry = sum(prev, t => (t.realTotal || 0) - (t.contado || 0));
  const n = nextNum(D, 'AQ'); const r = makeRng(D.meta.id + ':aq:' + n);
  let diff = 0;
  if (!cfg || cfg.arqueoDif !== false) { const x = r(); if (x > 0.45) { diff = Math.round((2000 + r() * 58000) / 50) * 50 * (x > 0.72 ? 1 : -1); } }
  const realTotal = Math.max(0, round50(libros + carry + diff));
  return { libros, realTotal, real: makeDrawer(realTotal, D.meta.id + ':drawer:' + n), n };
}
function buildArqueo(D, f) {
  const set = f.setup || arqueoSetup(D, f.fecha, f.cfg);
  const conteo = {}; DENOMS.forEach(d => { conteo[d] = Math.max(0, Math.round(+f.conteo[d] || 0)); });
  const contado = sum(DENOMS, d => d * conteo[d]);
  const dif = contado - set.libros;
  if (dif < 0 && !['1365', '5315'].includes(f.cuenta)) throw new Error('Elige cómo se trata el faltante.');
  if (!String(f.responsable || '').trim()) throw new Error('Escribe el nombre del cajero responsable.');
  const t = baseTx(D, 'AQ', f.fecha);
  Object.assign(t, { libros: set.libros, realTotal: set.realTotal, real: set.real, conteo, contado, dif, cuenta: dif < 0 ? f.cuenta : dif > 0 ? '4295' : '', responsable: f.responsable.trim(), obs: (f.obs || '').trim(), acierto: contado === set.realTotal });
  t.asiento = dif < 0 ? checkBalance([{ c: f.cuenta, d: -dif, x: 'Faltante en arqueo de caja' + (f.cuenta === '1365' ? ' · a cargo de ' + t.responsable : '') }, { c: '1105', h: -dif, x: 'Faltante en arqueo de caja' }])
    : dif > 0 ? checkBalance([{ c: '1105', d: dif, x: 'Sobrante en arqueo de caja' }, { c: '4295', h: dif, x: 'Sobrante en arqueo de caja' }]) : [];
  return t;
}

/* ---------- Banco: extractos generados a partir de los movimientos ---------- */
const BANK_DESC = { dep: 'CONSIGNACION EN EFECTIVO', datafono: 'ABONO VENTAS DATAFONO', tin: 'TRANSFERENCIA RECIBIDA', tout: 'TRANSFERENCIA ENVIADA' };
function bankDelay(l) { const h = hashStr(l.key); return { dep: h % 2, datafono: 1, tin: 0, tout: 0, chq: 2 + (h % 6) }[l.bank.k] || 0; }
function nextExtractPeriod(D) { const C = compute(D); const ex = C.extracts; return ex.length ? nextPeriod(ex[ex.length - 1].periodo) : perOf(D.meta.inicio); }
function buildExtract(D, P) {
  const C = compute(D), exs = C.extracts;
  if (P !== nextExtractPeriod(D)) throw new Error('Los extractos se solicitan en orden, mes por mes.');
  const Pstart = P + '-01', Pend = lastDayOf(P);
  const saldoAnt = exs.length ? exs[exs.length - 1].saldoFinal : D.meta.banco.saldo0;
  const incl = new Set(exs.flatMap(e => e.incluye || []));
  const rows = [];
  C.lines.filter(l => l.c === '1110' && l.bank && !l.bankRef && !incl.has(l.key)).forEach(l => {
    let bd = addDays(l.fecha, bankDelay(l)); if (bd > Pend) return; if (bd < Pstart) bd = Pstart;
    const desc = l.bank.k === 'chq' ? `CHEQUE PAGADO No ${l.bank.n}` : BANK_DESC[l.bank.k];
    rows.push({ key: 'X' + l.key, d: bd, desc, deb: l.h || 0, cre: l.d || 0, src: 'libro', lk: l.key, kind: l.bank.k });
  });
  const dat = sum(rows.filter(r => r.kind === 'datafono'), r => r.cre);
  if (dat) rows.push({ key: `B:${P}:dat`, d: Pend, desc: 'COMISION VENTAS DATAFONO', deb: Math.round(dat * 0.02), cre: 0, src: 'banco', kind: 'comision' });
  const yaPagadas = new Set(exs.flatMap(e => e.rows.filter(r => r.factura).map(r => r.factura)));
  const pend = C.act.filter(t => t.tipo === 'FE' && (C.cxc[t.id] || 0) > 0 && t.fecha <= addDays(Pend, -3) && !yaPagadas.has(t.id));
  if (pend.length && hashStr(D.meta.id + P) % 10 < 6) {
    const t = pend[hashStr(P + D.meta.id) % pend.length], ter = tercero(D, t.tercero);
    let dd = addDays(t.fecha, 5 + hashStr(t.id) % 6); if (dd > Pend) dd = Pend; if (dd < Pstart) dd = Pstart;
    rows.push({ key: `B:${P}:cli`, d: dd, desc: `TRANSFERENCIA RECIBIDA NIT ${ter.doc} ${String(ter.nombre).toUpperCase()}`, deb: 0, cre: C.cxc[t.id], src: 'banco', kind: 'cliente', factura: t.id, tercero: t.tercero });
  }
  rows.push({ key: `B:${P}:cuota`, d: Pend, desc: 'CUOTA DE MANEJO', deb: 15000 + (hashStr(D.meta.id + P + 'c') % 151) * 100, cre: 0, src: 'banco', kind: 'comision' });
  const intereses = Math.max(1, Math.round(saldoAnt * 0.0004));
  rows.push({ key: `B:${P}:int`, d: Pend, desc: 'ABONO INTERESES CTA', deb: 0, cre: intereses, src: 'banco', kind: 'interes' });
  const gmf = Math.round(sum(rows, r => r.deb) * 0.004);
  if (gmf) rows.push({ key: `B:${P}:gmf`, d: Pend, desc: 'GMF 4X1000', deb: gmf, cre: 0, src: 'banco', kind: 'gmf', base: sum(rows, r => r.deb) });
  rows.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : (b.cre - a.cre)));
  let s = saldoAnt; rows.forEach(r => { s += r.cre - r.deb; r.saldo = s; });
  return { id: 'EXT-' + P, tipo: 'EXT', num: 0, periodo: P, fecha: Pend, ts: Date.now(), saldoAnt, saldoFinal: s, rows, incluye: rows.filter(r => r.lk).map(r => r.lk) };
}

/* ---------- Conciliación bancaria ---------- */
const CLS = [['C', 'Coincide (punteada ✓)'], ['T', 'Consignación en tránsito'], ['P', 'Cheque pendiente de cobro'], ['ND', 'Nota débito no registrada'], ['NC', 'Nota crédito no registrada']];
const CLS_LABEL = Object.fromEntries(CLS);
const CLS_CORTO = { C: 'Coincidentes', T: 'Consig. en tránsito', P: 'Cheques pendientes', ND: 'Notas débito', NC: 'Notas crédito' };

async function packData(D) {

      ${docHTML(t)}`;
  }
  if (m.kind === 'file') { const rec = D().tx[m.id]; return rec ? fileModalHTML(rec) : ''; }
  if (m.kind === 'ext') { const e = compute(D()).extracts.find(x => x.periodo === m.P); return `<div class="spread" style="margin-bottom:12px"><h3>Extracto de ${perName(m.P)}</h3><div class="row" style="gap:6px">${expBtns('extracto', m.P)}<button class="btn sm" data-act="closemodal">Cerrar</button></div></div>${extractoHTML(e)}`; }
  return '';
}
function canAnular(t) {
  if (t.anulado || ['INI', 'EXT', 'CON', 'MAIL', 'ARC'].includes(t.tipo) || t.origen === 'conciliacion') return false;
  const C = compute(D()); const incl = new Set(C.extracts.flatMap(e => e.incluye));
  if ((t.asiento || []).some((l, i) => incl.has(t.id + ':' + i))) return false;
  if ((t.tipo === 'FE' || t.tipo === 'FC') && C.lines.some(l => l.ap === t.id && l.tx.id !== t.id)) return false;
  return true;
}
function docsTable(list, cols, empty) {

}

/* ---------- Conciliación ---------- */
function explainRow(r, side) {
  if (side === 'L') {
    if (r.exp === 'C') return 'Aparece en el libro y en el extracto por el mismo valor: se puntea.';
    if (r.exp === 'T') return 'La empresa la registró, pero el banco todavía no la refleja en este extracto. Es una partida en tránsito: se SUMA al saldo del extracto y no lleva asiento.';
    return 'El pago se registró en libros, pero el banco aún no lo ha debitado (por ejemplo, un cheque que el proveedor no ha cobrado). Se RESTA del saldo del extracto y no lleva asiento.';
  }
  if (r.exp === 'C') return r.src === 'libro' ? 'Corresponde a un movimiento registrado en el libro: se puntea.' : 'Ya está registrado en libros con un ajuste: se puntea.';
  const m = { comision: 'Es un cobro del banco que la empresa conoce solo con el extracto. Se resta del saldo en libros: Db 5305 Gastos financieros / Cr 1110 Bancos.', gmf: `Es el gravamen a los movimientos financieros: 4 por mil sobre los débitos del mes. Se resta del saldo en libros: Db 5115 Impuestos (o 5305) / Cr 1110 Bancos.`, interes: 'Son intereses que el banco abonó. Se suman al saldo en libros: Db 1110 Bancos / Cr 4210 Ingresos financieros.', cliente: 'Un cliente pagó su factura directamente en la cuenta y la empresa no lo había registrado. Se suma al saldo en libros: Db 1110 Bancos / Cr 1305 Clientes (abono a su factura).' };

}

function estados(M, desde, hasta) {

const CARPETAS = ['Facturas de compra', 'Facturas de venta', 'Soportes de caja y bancos', 'Extractos bancarios', 'Contratos y documentos legales', 'Otros'];
const idb = {
  _db: null,
  open() { return this._db || (this._db = new Promise((res, rej) => { try { const r = indexedDB.open('lab_files', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } })); },
  async put(k, v) { const d = await this.open(); return new Promise((res, rej) => { const tx = d.transaction('f', 'readwrite'); tx.objectStore('f').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
  async get(k) { const d = await this.open(); return new Promise((res, rej) => { const r = d.transaction('f').objectStore('f').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async del(k) { const d = await this.open(); return new Promise(res => { const tx = d.transaction('f', 'readwrite'); tx.objectStore('f').delete(k); tx.oncomplete = res; tx.onerror = res; }); }
};
const ASSET_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'application/pdf', 'text/csv', 'text/plain', 'application/json', 'text/markdown'];
function mimeOf(file) { const n = file.name.toLowerCase(); if (file.type && file.type !== 'application/octet-stream') return file.type.split(';')[0]; return n.endsWith('.pdf') ? 'application/pdf' : n.endsWith('.png') ? 'image/png' : /\.jpe?g$/.test(n) ? 'image/jpeg' : n.endsWith('.csv') ? 'text/csv' : n.endsWith('.txt') ? 'text/plain' : 'application/octet-stream'; }
async function storeFile(file, meta) {
  const mime = mimeOf(file);
  if (file.size > 20 * 1024 * 1024) throw new Error(`${file.name} supera el límite de 20 MB.`);
  const rec = { id: newId('ARC'), tipo: 'ARC', num: nextNum(S.ME, 'ARC'), fecha: S.ME.meta.fecha, ts: Date.now(), nombre: file.name, mime, size: file.size, carpeta: meta.carpeta || 'Otros', desc: meta.desc || '', link: meta.link || '' };
  let done = false;
  if (S.assets && S.ME.mode === 'db' && ASSET_TYPES.includes(mime)) {
    try { const r = await S.assets.upload(file, { type: mime }); rec.store = 'asset'; rec.ref = r.id; done = true; } catch (e) { if (e && e.code === 'quota_or_state') flash('El almacenamiento de archivos de la plataforma está lleno; el archivo se guarda en este navegador.', 'warn'); }
  }
  if (!done) { rec.store = 'local'; rec.ref = rec.id; await idb.put(rec.id, file); }
  await persistTx(rec);
  return rec;
}
async function fileBlob(rec) {
  if (rec.store === 'asset') { const r = await fetch('/_blob/' + rec.ref); if (!r.ok) throw new Error('El archivo no está disponible para esta cuenta.'); return await r.blob(); }
  const b = await idb.get(rec.ref); if (!b) throw new Error('Este archivo quedó guardado en el navegador de quien lo subió y no está en este equipo.'); return b;
}
async function renderPdfPages(blob, maxPages, scale) {
  await loadLibs('pdfjs');
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
  const out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, maxPages); i++) { const pg = await pdf.getPage(i); const vp = pg.getViewport({ scale: scale || 1.3 }); const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; out.push(c); }
  return { pdf, canvases: out };
}

async function fillPreview(rec) {
  S.prevCache = S.prevCache || {};

  let html;
  try {
    const b = await fileBlob(rec);
    if (rec.mime.startsWith('image/')) html = `<img src="${URL.createObjectURL(b)}" alt="${esc(rec.nombre)}" style="max-width:100%;border:1px solid var(--line);border-radius:8px">`;
    else if (rec.mime === 'application/pdf') { const { pdf, canvases } = await renderPdfPages(b, 4, 1.4); html = canvases.map(c => `<img src="${c.toDataURL('image/png')}" alt="Página del PDF" style="max-width:100%;border:1px solid var(--line);border-radius:6px">`).join('') + (pdf.numPages > 4 ? `<p class="small muted">Se muestran 4 de ${pdf.numPages} páginas. Descarga el archivo para verlo completo.</p>` : ''); }
    else if (/^text\/|json/.test(rec.mime)) { const tx = await b.text(); html = `<pre style="width:100%;max-height:420px;overflow:auto;font-size:.78rem;background:var(--surface-2);padding:12px;border-radius:8px">${esc(tx.slice(0, 20000))}</pre>`; }
    else html = '<div class="empty" style="width:100%">Este tipo de archivo no tiene vista previa. Descárgalo para abrirlo.</div>';
    S.prevCache[rec.id] = html;
  } catch (e) { html = `<div class="note warn" style="width:100%">${esc(e.message)}</div>`; }
  const box = document.getElementById('file-preview'); if (box) box.innerHTML = html;
}

/* ---------- Lectura automática de facturas de compra ---------- */
const normTxt = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const digits = s => String(s || '').replace(/\D/g, '');
function matchProduct(M, desc) {
  const w = new Set(normTxt(desc).split(' ').filter(x => x.length > 2)); let best = null, bs = 0;
  (M.meta.productos || []).forEach(p => { const pw = normTxt(p.nombre).split(' ').filter(x => x.length > 2); if (!pw.length) return; const hit = pw.filter(x => w.has(x)).length / pw.length; if (hit > bs) { bs = hit; best = p; } });
  return bs >= 0.5 ? best : null;
}
async function readInvoice(file) {
  let text = '', images = [];
  const mime = mimeOf(file);
  if (mime === 'application/pdf') {
    await loadLibs('pdfjs');
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) { const pg = await pdf.getPage(i); const tc = await pg.getTextContent(); text += tc.items.map(x => x.str).join(' ') + '\n'; }
    if (text.replace(/\s/g, '').length < 60) { text = ''; const { canvases } = await renderPdfPages(file, 1, 2); images = [await new Promise(r => canvases[0].toBlob(r, 'image/png'))]; }
  } else if (mime.startsWith('image/')) images = [file];
  else throw new Error('Sube la factura en PDF o como imagen (JPG o PNG).');
  if (images.length) { let lim = null; try { lim = S.sample.limits ? await S.sample.limits() : null; } catch (e) { } if (lim && !lim.images) throw new Error('La lectura de imágenes no está disponible en esta vista. Sube la factura en PDF con texto.'); }
  const prompt = `Eres un asistente contable en Colombia. Lee esta factura de compra (la empresa compradora es "${S.ME.meta.emp.razon}", NIT ${S.ME.meta.emp.nit}; el proveedor es quien la emite) y extrae los datos.
Responde SOLO con un objeto JSON válido, sin texto adicional, con esta forma exacta:
{"proveedor_nombre": string, "proveedor_nit": string, "proveedor_correo": string|null, "numero_factura": string, "fecha": "AAAA-MM-DD", "forma_pago": "credito"|"contado", "retencion_porcentaje": number|null,
 "items": [{"descripcion": string, "cantidad": number, "valor_unitario": number, "iva_porcentaje": number, "categoria": "mercancia"|"servicio"|"arrendamiento"|"mantenimiento"|"equipo"|"otro"}],
 "subtotal": number, "iva": number, "total": number}
Reglas: valores en pesos sin puntos ni signos; valor_unitario SIN IVA; si un dato no aparece usa null; "mercancia" es lo que la empresa compra para revender.${text ? '\n\nTEXTO EXTRAÍDO DE LA FACTURA:\n' + text.slice(0, 14000) : ''}`;
  const opts = images.length ? { images, modelTier: 'default' } : { modelTier: 'default' };
  let v;
  try { v = await S.sample.json(prompt, opts); }
  catch (e) {
    if (e && (e.code === 'not_granted' || e.code === 'rate_limited')) throw new Error(e.code === 'rate_limited' ? 'Hay demasiadas lecturas seguidas. Espera un momento e intenta de nuevo.' : 'La lectura automática no está disponible en esta vista.');
    const r = await S.sample(prompt, opts); const mt = String(r.text || '').match(/\{[\s\S]*\}/); if (!mt) throw new Error('No se pudieron leer los datos de la factura.'); v = JSON.parse(mt[0]);
  }
  if (typeof v === 'string') { const mt = v.match(/\{[\s\S]*\}/); v = mt ? JSON.parse(mt[0]) : null; }
  if (!v || typeof v !== 'object') throw new Error('No se pudieron leer los datos de la factura.');
  return v;
}
async function applyInvoice(v) {
  const M = S.ME, notes = [];
  const f = S.f.fc || (S.f.fc = { tercero: '', factProv: '', fecha: today(), medio: 'credito', retPct: '0', items: [] });
  let ter = null; const nd = digits(v.proveedor_nit).slice(0, 9);
  if (nd.length >= 6) ter = M.meta.terceros.find(t => digits(t.doc).slice(0, 9) === nd);
  if (!ter && v.proveedor_nombre) ter = M.meta.terceros.find(t => normTxt(t.nombre) === normTxt(v.proveedor_nombre));
  if (!ter && v.proveedor_nombre) { ter = { id: 'T' + Date.now().toString(36), tipoDoc: 'NIT', doc: String(v.proveedor_nit || ''), nombre: String(v.proveedor_nombre), rol: 'proveedor', correo: v.proveedor_correo || '' }; M.meta.terceros.push(ter); await persistMeta(); notes.push(`Se creó el proveedor ${ter.nombre} en Terceros.`); }
  else if (ter && ter.rol === 'cliente') { ter.rol = 'ambos'; await persistMeta(); }
  f.tercero = ter ? ter.id : '';
  f.factProv = v.numero_factura ? String(v.numero_factura) : '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(v.fecha || '')) { if (v.fecha >= M.meta.inicio) f.fecha = v.fecha; else notes.push(`La factura es del ${fd(v.fecha)}, antes del inicio de la empresa: se dejó la fecha de trabajo.`); }
  f.medio = v.forma_pago === 'contado' ? (f.medio === 'credito' ? 'transferencia' : f.medio) : 'credito';
  if ([2.5, 4, 3.5, 6].includes(+v.retencion_porcentaje)) f.retPct = String(+v.retencion_porcentaje);
  const cta = { servicio: '5135', arrendamiento: '5120', mantenimiento: '5145', equipo: '1524', otro: '5195' };
  f.items = (Array.isArray(v.items) ? v.items : []).map(it => {
    const iva = [0, 5, 19].includes(+it.iva_porcentaje) ? String(+it.iva_porcentaje) : '19';
    const base = { q: String(+it.cantidad || 1), vu: String(Math.round(+it.valor_unitario || 0)), iva };
    if (it.categoria === 'mercancia') { const p = matchProduct(M, it.descripcion); if (p) return { tipo: 'prod', p: p.id, cta: '', desc: '', ...base }; notes.push(`«${it.descripcion}» parece mercancía pero no coincide con ningún producto: créalo en Productos o elige uno.`); return { tipo: 'prod', p: '', cta: '', desc: it.descripcion, ...base }; }
    return { tipo: 'gasto', p: '', cta: cta[it.categoria] || '5195', desc: String(it.descripcion || '').slice(0, 60), ...base };
  });
  if (!f.items.length) { f.items = [{ tipo: 'prod', p: '', cta: '', desc: '', q: '1', vu: '', iva: '19' }]; notes.push('No se encontraron renglones: complétalos a mano.'); }
  const tot = calcItems(f.items.map(i => ({ q: num(i.q), vu: num(i.vu), iva: num(i.iva) })));
  if (v.total && Math.abs(tot.total - v.total) > Math.max(100, v.total * 0.005)) notes.push(`El total calculado (${fmt(tot.total)}) no coincide con el total de la factura (${fmt(v.total)}). Revisa cantidades, valores e IVA.`);
  S.ui.fcNotes = notes; S.ui.fcNew = true;
}

    render();
  }
});
document.addEventListener('change', e => { if (e.target.id === 'fc-file') { S.fcFile = e.target.files[0] || null; S.ui.fcRead = ''; S.ui.fcReadErr = ''; render(); } });
init();

</script>
</body>
